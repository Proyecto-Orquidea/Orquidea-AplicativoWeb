[package]
name = "conciencia-mujer"
version = "1.0.0"
description = "Análisis de Datos - Violencia de Género en Colombia"
authors = ["Orquidea"]
edition = "2021"

[lib]
name = "conciencia_mujer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
